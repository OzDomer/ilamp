[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ilamp"
version = "0.1.0"
description = "Control an old i_Lamp Bluetooth speaker lamp from Python (reverse-engineered protocol)"
requires-python = ">=3.10"
dependencies = ["bleak>=0.21"]

[project.optional-dependencies]
dev = ["pytest"]

# Only ilamp/ is the library. tests/ and examples/ stay in the repo
# but don't get installed as packages.
[tool.setuptools]
packages = ["ilamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

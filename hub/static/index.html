<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <title>i_Lamp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel" data-link="hub" data-on="false" data-mode="normal">

    <header class="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status">connecting to the hub…</span>
    </header>

    <!-- The lamp itself. Shows what the lamp REPORTS, never what we asked for. -->
    <section class="stage">
      <button class="lamp" id="lamp" type="button" aria-pressed="false" aria-label="Power">
        <span class="lamp-face" aria-hidden="true"></span>
        <span class="lamp-label" id="lampLabel">off</span>
      </button>
    </section>

    <section class="control">
      <label class="control-head" for="brightness">
        <span>Brightness</span>
        <output id="brightnessValue" for="brightness">—</output>
      </label>
      <input id="brightness" type="range" min="0" max="255" step="1" value="255">
    </section>

    <section class="control">
      <div class="control-head">
        <span>Color</span>
        <output id="colorValue">—</output>
      </div>
      <div class="swatches">
        <label class="swatch swatch-pick" title="Pick any color">
          <input id="color" type="color" value="#ffffff" aria-label="Pick any color">
        </label>
        <button class="swatch" type="button" data-rgb="255,120,40"  style="--c:#ff7828" aria-label="Warm"></button>
        <button class="swatch" type="button" data-rgb="255,190,70"  style="--c:#ffbe46" aria-label="Amber"></button>
        <button class="swatch" type="button" data-rgb="255,0,0"     style="--c:#ff0000" aria-label="Red"></button>
        <button class="swatch" type="button" data-rgb="0,255,0"     style="--c:#00ff00" aria-label="Green"></button>
        <button class="swatch" type="button" data-rgb="0,0,255"     style="--c:#0000ff" aria-label="Blue"></button>
        <button class="swatch" type="button" data-rgb="255,255,255" style="--c:#ffffff" aria-label="White"></button>
      </div>
    </section>

    <!-- The white ring: real room light. The lamp runs it OR the RGB light, never both. -->
    <section class="control">
      <div class="control-head">
        <span>Room light</span>
        <output id="sunLevelValue" for="sunLevel">—</output>
      </div>
      <div class="sun-row">
        <button class="toggle" id="sunToggle" type="button" aria-pressed="false">Ring</button>
        <div class="sun-temp">
          <input id="sunTemp" type="range" min="0" max="255" step="1" value="128" aria-label="Warm to cold">
          <div class="temp-scale" aria-hidden="true"><span>warm</span><span>cold</span></div>
        </div>
      </div>
      <input id="sunLevel" type="range" min="0" max="16" step="1" value="16" aria-label="Room light brightness">
    </section>

    <section class="control">
      <div class="control-head"><span>Mode</span></div>
      <div class="modes" id="modes" role="group" aria-label="Mode">
        <button type="button" data-mode="normal">Normal</button>
        <button type="button" data-mode="pulse">Pulse</button>
        <button type="button" data-mode="rhythm">Rhythm</button>
        <button type="button" data-mode="rainbow">Rainbow</button>
        <button type="button" data-mode="candlelight">Candle</button>
        <button type="button" data-mode="alert">Alert</button>
      </div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
